[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "job-posting-analyzer"
version = "0.1.0"
description = "Evidence-backed job advertisement analysis in the terminal"
requires-python = ">=3.12"
dependencies = ["google-genai", "pydantic>=2,<3"]

[project.scripts]
job-analyzer = "job_posting_analyzer.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
